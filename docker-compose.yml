version: "3.9"

services:
  api:
    build: ./backend
    container_name: app-api
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.prod
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    build: ./frontend
    container_name: app-web
    environment:
      VITE_API_URL: "http://3.138.189.214:3000/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo:
    image: mongo:7
    container_name: app-mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "6379:6379"

