version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.prod
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    build: ./frontend
    environment:
      VITE_API_URL: "http://18.225.8.58:3000/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
